<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <rect width="150" height="150" fill="white"/>
  <g transform="translate(75, 76)" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#111">
    <!-- Wordmark pun: oversized C + onductor -->
    <text text-anchor="middle" y="6" font-size="20" font-weight="600" letter-spacing="-0.3">
      <tspan font-size="46" font-weight="800">C</tspan><tspan>onductor</tspan>
    </text>
    <!-- Conductor's baton rising from the C -->
    <line x1="-39" y1="-22" x2="-28" y2="-42" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-28" cy="-42" r="3.25" fill="#111"/>
    <!-- Conducting motion arc -->
    <path d="M -32 30 Q 0 40 32 30" fill="none" stroke="#111" stroke-width="1.75" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
